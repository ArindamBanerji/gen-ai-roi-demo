name: CI

on:
  push:
    branches: [v5.0-dev]
  pull_request:
    branches: [v5.0-dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out ci-platform dependency
        uses: actions/checkout@v4
        with:
          repository: ArindamBanerji/ci-platform
          path: ci-platform

      - name: Check out graph engine dependency
        uses: actions/checkout@v4
        with:
          repository: ArindamBanerji/graph-attention-engine-v50
          path: graph-attention-engine-v50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest-timeout mypy

      - name: Run SOC backend tests
        working-directory: backend
        run: python -m pytest tests/ -q --timeout=300

      - name: Run SOC mypy
        run: python -m mypy backend/app/ --follow-imports=skip --no-error-summary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check backend/app/ --select E,F,W --ignore E501

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install bandit

      - name: Security scan
        run: bandit -r backend/app/ -ll --exclude backend/app/tests
