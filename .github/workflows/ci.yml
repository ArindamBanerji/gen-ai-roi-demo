name: CI

on:
  push:
    branches: [v5.0-dev]
  pull_request:
    branches: [v5.0-dev]

jobs:
  backend-targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest-timeout

      - name: Run targeted SOC tests
        working-directory: backend
        run: >
          python -m pytest
          tests/test_tab7_governance.py
          tests/test_executive_narrative.py
          tests/test_d06_unmapped.py
          -q
          --timeout=300

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check backend/app/ --select E,F,W --ignore E501

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: python -m pip install bandit

      - name: Security scan
        run: bandit -r backend/app/ -ll --exclude backend/app/tests
