# contracts/api_contracts.yaml — API endpoint contracts
# Every endpoint that the frontend or E2E tests depend on.
# validate_contracts.py checks: status 200 + required fields present.
#
# consumed_by: which frontend tab or test hits this endpoint
# required_fields: top-level keys that MUST be present in the JSON response
# method: GET or POST
# body: request body for POST endpoints (optional)
#
# Destructive endpoints excluded: admin/reset, demo/reset-all, demo/reseed,
# demo/seed, demo/reset — these trigger state resets, not API contracts.

endpoints:

  # ── AlertTriageTab ──────────────────────────────────────────
  - path: /api/alerts/queue
    method: GET
    required_fields: [alerts]
    consumed_by: [AlertTriageTab]

  - path: /api/alert/analyze
    method: POST
    body: {"alert_id": "__FROM_QUEUE__"}
    required_fields: [alert, context, recommendation]
    consumed_by: [AlertTriageTab]
    depends_on: /api/alerts/queue

  - path: /api/action/execute
    method: POST
    body: {"alert_id": "__FROM_QUEUE__", "action": "investigate"}
    required_fields: [receipt, verification, evidence, kpi_impact]
    consumed_by: [AlertTriageTab]
    depends_on: /api/alerts/queue

  - path: /api/alerts/reset
    method: POST
    body: {}
    required_fields: [status]
    consumed_by: [AlertTriageTab, CompoundingTab]

  - path: /api/triage/decision-factors/SIM-001
    method: GET
    required_fields: [alert_id, factors]
    consumed_by: [AlertTriageTab]

  - path: /api/alert/policy-check?alert_id=SIM-001
    method: GET
    required_fields: [alert_id]
    consumed_by: [AlertTriageTab]

  - path: /api/graph/threat-intel/refresh
    method: POST
    body: {"source": "pulsedive"}
    required_fields: [source, indicators_ingested]
    consumed_by: [AlertTriageTab]

  - path: /api/graph/enrichment/by-alert/SIM-001
    method: GET
    required_fields: [alert_id]
    consumed_by: [AlertTriageTab]

  # ── SOCAnalyticsTab ─────────────────────────────────────────
